const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const GREG_MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const GREG_MONTHS_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const BANGLA_MONTHS = ["Boishakh","Jestha","Ashar","Shrabon","Bhadro","Ashwin","Kartik","Ogrohayon","Poush","Magh","Falgun","Choitro"];
const HIJRI_MONTHS = ["Muharram","Safar","Rabiul Awal","Rabius Sani","Jamadal Awal","Jamadas Sani","Rajab","Shaban","Ramadan","Shawwal","Zilqad","Zilhajj"];

function isGregLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
function weekNumberSunday(date) {
  const d = atMidnight(date);
  const start = new Date(d.getFullYear(), 0, 1);
  const diffDays = Math.round((d - start) / 86400000);
  return Math.ceil((diffDays + start.getDay() + 1) / 7);
}
function getBanglaDate(date) {
  const d = atMidnight(date);
  const y = d.getFullYear();
  const newYearThisYear = new Date(y, 3, 14);
  let bYear, startDate;
  if (d >= newYearThisYear) { bYear = y - 593; startDate = newYearThisYear; }
  else { bYear = y - 594; startDate = new Date(y - 1, 3, 14); }
  const dayOfYear = Math.round((d - startDate) / 86400000) + 1;
  const falgunDays = isGregLeap(startDate.getFullYear() + 1) ? 30 : 29;
  const monthLens = [31,31,31,31,31,31,30,30,30,30, falgunDays, 30];
  let remaining = dayOfYear, mIdx = 0;
  for (; mIdx < 12; mIdx++) {
    if (remaining <= monthLens[mIdx]) break;
    remaining -= monthLens[mIdx];
  }
  return { day: remaining, month: BANGLA_MONTHS[mIdx], year: bYear };
}
function getHijriDate(date) {
  try {
    const offset = globalSettings.hijriOffsetDays || 0;
    const shifted = new Date(date.getTime() + offset * 86400000);
    const fmt = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", { day: "numeric", month: "numeric", year: "numeric" });
    const parts = fmt.formatToParts(shifted);
    const day = +parts.find(p => p.type === "day").value;
    const month = +parts.find(p => p.type === "month").value;
    const year = +parts.find(p => p.type === "year").value;
    return { day, month: HIJRI_MONTHS[month - 1], year };
  } catch { return null; }
}
function formatTimeDisplay(date, format) {
  if (format === "24h") return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
  let h = date.getHours();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12; if (h === 0) h = 12;
  return `${h}:${String(date.getMinutes()).padStart(2, "0")} ${ampm}`;
}
function dateBarHtml() {
  const now = new Date();
  const parts = [];
  if (dispSettings.showWeekday) parts.push(WEEKDAYS[now.getDay()]);
  if (dispSettings.showWeek) parts.push(`WK-${weekNumberSunday(now)}`);
  if (dispSettings.showGregorian) parts.push(`${String(now.getDate()).padStart(2,"0")}-${GREG_MONTHS[now.getMonth()]}-${now.getFullYear()}`);
  if (dispSettings.showTime) parts.push(formatTimeDisplay(now, dispSettings.timeFormat || "12h"));
  if (dispSettings.showBangla) { const b = getBanglaDate(now); parts.push(`${b.day}-${b.month}-${b.year}`); }
  if (dispSettings.showHijri) { const h = getHijriDate(now); if (h) parts.push(`${h.day}-${h.month}-${h.year}`); }
  if (parts.length === 0) return "";
  return `<div class="mx-auto max-w-5xl px-4 pb-2 text-xs" style="color:#8a8578">${parts.map(esc).join(" &nbsp;│&nbsp; ")}</div>`;
}

// ---------------------------------------------------------------------------
// Permissions
// ---------------------------------------------------------------------------
function isAdmin() { return !!(profile && profile.role === "admin"); }
function permFor(subUnitId) {
  if (isAdmin()) return { view: true, add: true, edit: true, reportView: true, reportDownload: true };
  const p = (profile && profile.permissions && profile.permissions[subUnitId]) || {};
  return { view: !!p.view, add: !!p.add, edit: !!p.edit, reportView: !!p.reportView, reportDownload: !!p.reportDownload };
}
function canView(subUnitId) { const p = permFor(subUnitId); return p.view || p.add || p.edit; }
function canAdd(subUnitId) { return permFor(subUnitId).add; }
function canEdit(subUnitId) { return permFor(subUnitId).edit; }
function canReportView(subUnitId) { return permFor(subUnitId).reportView; }
function canReportDownload(subUnitId) { return permFor(subUnitId).reportDownload; }
function accessibleUnits() {
  if (isAdmin()) return units;
  const okSubUnitIds = new Set(subUnits.filter(s => canView(s.id)).map(s => s.id));
  return units.filter(u => subUnits.some(s => s.unitId === u.id && okSubUnitIds.has(s.id)) || canView(u.id));
}
function accessibleSubUnitsOf(unitId) {
  const list = subUnits.filter(s => s.unitId === unitId);
  return isAdmin() ? list : list.filter(s => canView(s.id));
}
function accessibleReportUnits() {
  if (isAdmin()) return units;
  const okSubUnitIds = new Set(subUnits.filter(s => canReportView(s.id)).map(s => s.id));
  return units.filter(u => subUnits.some(s => s.unitId === u.id && okSubUnitIds.has(s.id)));
}
function accessibleReportSubUnitsOf(unitId) {
  const list = subUnits.filter(s => s.unitId === unitId);
  return isAdmin() ? list : list.filter(s => canReportView(s.id));
}

// ---------------------------------------------------------------------------
// Approval workflow
// ---------------------------------------------------------------------------
function findLocal(coll, id) {
  const map = { tenants, events, rentPayments, expenses, eventPayments, eventExpenses, eventOtherServices, unitExpenses };
  return (map[coll] || []).find(x => x.id === id);
}
function snapshotBefore(coll, id, changes) {
  const item = findLocal(coll, id);
  const before = {};
  Object.keys(changes).forEach(k => { before[k] = item ? item[k] : null; });
  return before;
}
async function performEdit(targetCollection, targetId, changes, subUnitId) {
  if (isAdmin()) {
    await updateDoc(doc(db, targetCollection, targetId), changes);
    return "applied";
  }
  await addDoc(collection(db, "approvalRequests"), {
    targetCollection, targetId, changes, before: snapshotBefore(targetCollection, targetId, changes), subUnitId,
    requestedBy: currentUser.uid, requestedByName: profile.name || profile.username || currentUser.email,
    status: "pending", createdAt: serverTimestamp(),
  });
  return "pending";
}
function pendingApprovalFor(targetId) {
  return approvalRequests.find(r => r.targetId === targetId && r.status === "pending");
}

function eventOtherTotal(eventId) { return eventOtherServices.filter(o => o.eventId === eventId).reduce((s, o) => s + o.amount, 0); }
function eventTotalOwed(ev) { return (ev.totalRentAmount || 0) + eventOtherTotal(ev.id); }
function eventBalance(ev) {
  const pays = eventPayments.filter(p => p.eventId === ev.id);
  const paid = pays.filter(p => p.type !== "refund").reduce((s, p) => s + p.amount, 0);
  const refunded = pays.filter(p => p.type === "refund").reduce((s, p) => s + p.amount, 0);
  return eventTotalOwed(ev) - paid + refunded;
}
function eventPriority(ev) {
  if (ev.status === "cancelled") return 2;
  return eventBalance(ev) > 0 ? 0 : 1;
}
function sortedEvents(list) {
  return [...list].sort((a, b) => {
    const pa = eventPriority(a), pb = eventPriority(b);
    if (pa !== pb) return pa - pb;
    return (a.eventDate || "") < (b.eventDate || "") ? -1 : 1;
  });
}
function placeName(placeId) { return eventPlaces.find(p => p.id === placeId)?.name || "—"; }

function computeDashboardStats() {
  const todayStr = todayISO();
  const pending = events.filter(e => e.status !== "cancelled" && eventBalance(e) > 0);
  const upcoming = pending.filter(e => e.eventDate >= todayStr).sort((a, b) => (a.eventDate > b.eventDate ? 1 : -1))[0];
  const subUnitById = Object.fromEntries(subUnits.map(s => [s.id, s]));
  let shopDue = 0, houseDue = 0;
  tenants.forEach(tn => {
    if (tn.active === false) return;
    if (!propertyIds.some(p => p.id === tn.propertyId)) return;
    if (dueMonthsFor(tn).length === 0) return;
    const name = (subUnitById[tn.subUnitId]?.name || "").toLowerCase();
    if (name.includes("shop")) shopDue++;
    else if (name.includes("house")) houseDue++;
  });
  const unitExpDueCount = dueUnitExpenseCategories().length;
  return { upcomingDate: upcoming ? upcoming.eventDate : null, pendingCount: pending.length, shopDue, houseDue, unitExpDueCount };
}
function dueTenantsFor(category) {
  const subUnitById = Object.fromEntries(subUnits.map(s => [s.id, s]));
  return tenants.filter(tn => {
    if (tn.active === false) return false;
    if (!propertyIds.some(p => p.id === tn.propertyId)) return false;
    if (dueMonthsFor(tn).length === 0) return false;
    const name = (subUnitById[tn.subUnitId]?.name || "").toLowerCase();
    return name.includes(category);
  });
}

function reportInPeriod(dateStr) {
  if (!dateStr) return false;
  if (reportPeriodType === "daily") return dateStr === reportPeriodValue;
  if (reportPeriodType === "monthly") return dateStr.slice(0, 7) === reportPeriodValue;
  if (reportPeriodType === "range") return dateStr >= reportRangeStart && dateStr <= reportRangeEnd;
  return dateStr.slice(0, 4) === reportPeriodValue;
}
function defaultPeriodValue(type) {
  const now = new Date();
  if (type === "daily") return todayISO();
  if (type === "monthly") return todayISO().slice(0, 7);
  if (type === "yearly") return String(now.getFullYear());
  return null;
}

function computeAllTxns(subUnitIds, unitId, includeUnitLevel) {
  const txns = [];
  rentPayments.forEach(p => {
    if (!subUnitIds.includes(p.subUnitId)) return;
    txns.push({ id: p.id, coll: "rentPayments", date: p.paidDate, type: "income", source: t().collectRent, subUnitId: p.subUnitId, propertyId: p.propertyId || null, note: p.tenantName || "", amount: p.amount });
  });
  expenses.forEach(x => {
    if (!subUnitIds.includes(x.subUnitId)) return;
    txns.push({ id: x.id, coll: "expenses", date: x.date, type: "expense", source: expenseCategories.find(c => c.id === x.categoryId)?.name || "—", subUnitId: x.subUnitId, propertyId: x.propertyId || null, note: x.tenantName || x.details || "", amount: x.amount });
  });
  events.filter(e => subUnitIds.includes(e.subUnitId)).forEach(e => {
    eventPayments.filter(p => p.eventId === e.id).forEach(p => {
      if (p.type === "refund") {
        txns.push({ id: p.id, coll: "eventPayments", date: p.paidDate, type: "expense", source: t().refund, subUnitId: e.subUnitId, propertyId: null, note: `${e.customerName} (${e.memoNo})`, amount: p.amount });
      } else {
        txns.push({ id: p.id, coll: "eventPayments", date: p.paidDate, type: "income", source: p.type === "advance" ? t().advance : t().dueCollection, subUnitId: e.subUnitId, propertyId: null, note: `${e.customerName} (${e.memoNo})`, amount: p.amount });
      }
    });
    eventExpenses.filter(x => x.eventId === e.id).forEach(x => {
      txns.push({ id: x.id, coll: "eventExpenses", date: x.date, type: "expense", source: expenseCategories.find(c => c.id === x.categoryId)?.name || "—", subUnitId: e.subUnitId, propertyId: null, note: `${e.customerName} (${e.memoNo})`, amount: x.amount });
    });
  });
  if (includeUnitLevel && unitId) {
    unitExpenses.filter(x => x.unitId === unitId).forEach(x => {
      txns.push({ id: x.id, coll: "unitExpenses", date: x.date, type: "expense", source: unitExpenseCategories.find(c => c.id === x.categoryId)?.name || "—", subUnitId: null, unitLevel: true, unitIdRef: unitId, propertyId: null, note: x.details || "", amount: x.amount });
    });
  }
  return txns;
}
function computeReportTxns(subUnitIds, unitId, includeUnitLevel) {
  return computeAllTxns(subUnitIds, unitId, includeUnitLevel).filter(x => reportInPeriod(x.date)).sort((a, b) => (a.date < b.date ? 1 : -1));
}

function computeChartBuckets(subUnitIds, unitId, includeUnitLevel) {
  const all = computeAllTxns(subUnitIds, unitId, includeUnitLevel).filter(x => reportProperty === "all" || x.propertyId === reportProperty);
  let labels = [], keys = [];
  if (reportPeriodType === "daily") {
    const [y, m] = reportPeriodValue.split("-").map(Number);
    const days = new Date(y, m, 0).getDate();
    for (let d = 1; d <= days; d++) { labels.push(String(d)); keys.push(`${reportPeriodValue}-${String(d).padStart(2, "0")}`); }
    var bucketOf = (date) => date;
  } else if (reportPeriodType === "monthly") {
    const y = reportPeriodValue.slice(0, 4);
    for (let m = 1; m <= 12; m++) { labels.push(GREG_MONTHS[m - 1]); keys.push(`${y}-${String(m).padStart(2, "0")}`); }
    var bucketOf = (date) => date.slice(0, 7);
  } else if (reportPeriodType === "yearly") {
    const now = new Date();
    const years = all.map(x => Number(x.date.slice(0, 4))).filter(y => !isNaN(y) && y > 1900);
    const minY = years.length ? Math.min(...years, now.getFullYear()) : now.getFullYear();
    const maxY = years.length ? Math.max(...years, now.getFullYear()) : now.getFullYear();
    for (let y = minY; y <= maxY; y++) { labels.push(String(y)); keys.push(String(y)); }
    var bucketOf = (date) => date.slice(0, 4);
  } else {
    let cur = reportRangeStart;
    let guard = 0;
    while (cur <= reportRangeEnd && guard < 120) { labels.push(cur.slice(5)); keys.push(cur); cur = new Date(new Date(cur).getTime() + 86400000).toISOString().slice(0, 10); guard++; }
    var bucketOf = (date) => date;
  }
  const incomeMap = {}, expenseMap = {};
  keys.forEach(k => { incomeMap[k] = 0; expenseMap[k] = 0; });
  all.forEach(x => {
    const k = bucketOf(x.date);
    if (!(k in incomeMap)) return;
    if (x.type === "income") incomeMap[k] += x.amount; else expenseMap[k] += x.amount;
  });
  return { labels, income: keys.map(k => incomeMap[k]), expense: keys.map(k => expenseMap[k]) };
}

function exportReportPdf(txns, totalIncome, totalExpense) {
  try {

    const doc2 = new jsPDF();
    const pageHeight = doc2.internal.pageSize.getHeight();
    const marginLeft = 10;
    const colX = [10, 32, 62, 92, 132, 155, 178];
    const colW = [22, 30, 30, 40, 23, 23, 20];
    let y = 15;

    function header() {
      doc2.setFontSize(13);
      doc2.setFont(undefined, "bold");
      doc2.text("A&S Family Business - Report", marginLeft, y);
      y += 7;
      doc2.setFontSize(9);
      doc2.setFont(undefined, "normal");
      doc2.text(`Period: ${reportPeriodValue}   Income: Tk ${totalIncome}   Expense: Tk ${totalExpense}   Net: Tk ${totalIncome - totalExpense}`, marginLeft, y);
      y += 8;
      doc2.setFontSize(8);

      const heads = ["Date", "Sub Unit", "Source", "Note", "Type", "Amount"];
      heads.forEach((h, i) => doc2.text(h, colX[i], y));
      y += 2;
      doc2.line(marginLeft, y, 200, y);
      y += 5;
      doc2.setFont(undefined, "normal");
    }
    function truncate(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "." : s; }

    header();
    txns.forEach(x => {
      if (y > pageHeight - 15) { doc2.addPage(); y = 15; header(); }

        x.date, truncate(txnSubUnitLabel(x), 16), truncate(x.source, 20), truncate(x.note, 22),
        x.type === "income" ? "Income" : "Expense", `${x.type === "income" ? "" : "-"}Tk ${x.amount}`,
      ];
      row.forEach((val, i) => doc2.text(String(val), colX[i], y));
      y += 6;
    });
    doc2.save(`report-${reportPeriodValue}.pdf`);
  } catch (e) { alert("PDF export failed: " + e.message); }
}

// --- Shop/House: Property IDs ---
function activeTenantFor(propertyId) { return tenants.find(t => t.propertyId === propertyId && t.active !== false); }

// ---------------------------------------------------------------------------
// Rent due-months logic (Running Month vs Old Month billing system)
// ---------------------------------------------------------------------------
function monthPaidAmount(tenantId, month, year) {
  return rentPayments.filter(p => p.tenantId === tenantId && p.month === month && p.year === year).reduce((s, p) => s + p.amount, 0);
}
function ymAfter(a, b) { return a.year > b.year || (a.year === b.year && a.month > b.month); }
function ymLTE(a, b) { return !ymAfter(a, b); }
function ymAddMonths(ym, n) {
  let m = ym.month + n, y = ym.year;
  while (m > 12) { m -= 12; y++; }
  while (m < 1) { m += 12; y--; }
  return { month: m, year: y };
}
function effectiveDueYM(rentSystem, ref) {
  const d = ref || new Date();
  const cur = { month: d.getMonth() + 1, year: d.getFullYear() };
  return rentSystem === "old" ? ymAddMonths(cur, -1) : cur;
}
function tenantStartYM(tenant) {
  const setups = rentSetupsFor(tenant.id);
  if (setups.length) return { month: setups[0].startMonth, year: setups[0].startYear };
  if (tenant.rentStart) {
    const [y, m] = tenant.rentStart.split("-").map(Number);
    if (y && m) return { month: m, year: y };
  }
  const d = tenant.createdAt && tenant.createdAt.toDate ? tenant.createdAt.toDate() : new Date();
  return { month: d.getMonth() + 1, year: d.getFullYear() };
}
function monthsBetweenInclusive(start, end) {
  const arr = [];
  let cur = { ...start };
  let guard = 0;
  while (!ymAfter(cur, end) && guard < 240) {
    arr.push({ ...cur });
    cur = ymAddMonths(cur, 1);
    guard++;
  }
  return arr;
}

// Rent Setups: a tenant's monthly rent can change over time (rent increase).
// Each setup covers a [startMonth,endMonth] range (endMonth null = still running).
// Due/advance is always computed against the rate that applied to THAT month,
// never against today's rate — fixes rent increases retroactively marking
// already-paid old months as "due".
function rentSetupsFor(tenantId) {
  return rentSetups.filter(r => r.tenantId === tenantId).sort((a, b) => (a.startYear - b.startYear) || (a.startMonth - b.startMonth));
}
function rentAmountForMonth(tenantId, month, year) {
  const ym = { month, year };
  const setups = rentSetupsFor(tenantId);
  for (const s of setups) {
    const start = { month: s.startMonth, year: s.startYear };
    const end = (s.endMonth && s.endYear) ? { month: s.endMonth, year: s.endYear } : null;
    if (ymLTE(start, ym) && (!end || ymLTE(ym, end))) return s.amount;
  }
  const tn = tenants.find(t => t.id === tenantId);
  return tn ? (tn.rentAmount || 0) : 0;
}
function currentRentSetup(tenantId) {
  return rentSetupsFor(tenantId).find(s => !s.endMonth) || null;
}
function currentRentAmount(tenant) {
  const running = currentRentSetup(tenant.id);
  return running ? running.amount : (tenant.rentAmount || 0);
}

function dueMonthsFor(tenant) {
  const cutoff = effectiveDueYM(tenant.rentSystem || "running");
  const start = tenantStartYM(tenant);
  if (ymAfter(start, cutoff)) return [];
  return monthsBetweenInclusive(start, cutoff).filter(ym => monthPaidAmount(tenant.id, ym.month, ym.year) < rentAmountForMonth(tenant.id, ym.month, ym.year));
}
function dueAmountFor(tenant) {
  return dueMonthsFor(tenant).reduce((s, ym) => s + Math.max(0, rentAmountForMonth(tenant.id, ym.month, ym.year) - monthPaidAmount(tenant.id, ym.month, ym.year)), 0);
}
function advanceAmountFor(tenant) {
  const cutoff = effectiveDueYM(tenant.rentSystem || "running");
  return rentPayments.filter(p => p.tenantId === tenant.id && ymAfter({ month: p.month, year: p.year }, cutoff)).reduce((s, p) => s + p.amount, 0);
}
function monthYmLabel(ym) { return `${GREG_MONTHS_FULL[ym.month - 1]}-${ym.year}`; }

// ---------------------------------------------------------------------------
// Adding a rent change (increase/decrease): closes the current running
// setup at the month before the new one starts, then opens the new one.
// ---------------------------------------------------------------------------
async function addRentChange(tenant, newAmount, newStart, prevEndOverride) {
  const existing = rentSetupsFor(tenant.id);
  const prevMonth = prevEndOverride || ymAddMonths(newStart, -1);
  if (existing.length === 0) {
    // Legacy tenant with no setup history yet — backfill one covering their
    // whole history so far at the OLD flat rent amount.
    const oldStart = tenantStartYM(tenant);
    if (ymLTE(oldStart, prevMonth)) {
      await addDoc(collection(db, "rentSetups"), {
        tenantId: tenant.id, propertyId: tenant.propertyId, subUnitId: tenant.subUnitId,
        amount: tenant.rentAmount || 0, startMonth: oldStart.month, startYear: oldStart.year,
        endMonth: prevMonth.month, endYear: prevMonth.year, createdAt: serverTimestamp(),
      });
    }
  } else {
    const running = existing.find(s => !s.endMonth);
    if (running) {
      await updateDoc(doc(db, "rentSetups", running.id), { endMonth: prevMonth.month, endYear: prevMonth.year });
    }
  }
  await addDoc(collection(db, "rentSetups"), {
    tenantId: tenant.id, propertyId: tenant.propertyId, subUnitId: tenant.subUnitId,
    amount: newAmount, startMonth: newStart.month, startYear: newStart.year,
    endMonth: null, endYear: null, createdAt: serverTimestamp(),
  });
  await updateDoc(doc(db, "tenants", tenant.id), { rentAmount: newAmount });
}

// ---------------------------------------------------------------------------
// Unit Expense (fixed) due/advance — same due/advance logic as tenant rent,
// but per Unit Expense Category, monthly-frequency + fixedAmount only.
// ---------------------------------------------------------------------------
function unitExpenseMonthPaid(categoryId, month, year) {
  return unitExpenses.filter(x => x.categoryId === categoryId && x.month === month && x.year === year).reduce((s, x) => s + x.amount, 0);
}
function unitExpenseCurrentDue(cat) {
  if (cat.frequency !== "monthly" || !cat.fixedAmount) return 0;
  const now = new Date();
  return Math.max(0, cat.fixedAmount - unitExpenseMonthPaid(cat.id, now.getMonth() + 1, now.getFullYear()));
}
function unitExpenseCurrentAdvance(cat) {
  if (cat.frequency !== "monthly" || !cat.fixedAmount) return 0;
  const now = new Date();
  return Math.max(0, unitExpenseMonthPaid(cat.id, now.getMonth() + 1, now.getFullYear()) - cat.fixedAmount);
}
function dueUnitExpenseCategories() {
  return unitExpenseCategories.filter(c => unitExpenseCurrentDue(c) > 0);
}

function openCollectRentModal(prop, tenant) {
  const due = dueMonthsFor(tenant);
  const cutoff = effectiveDueYM(tenant.rentSystem || "running");
  const extraMonths = [1, 2, 3].map(n => ymAddMonths(cutoff, n));
  const allMonths = [...due, ...extraMonths];
  const monthAmount = (ym) => rentAmountForMonth(tenant.id, ym.month, ym.year);
  const sumOwed = (months) => months.reduce((s, ym) => s + Math.max(0, monthAmount(ym) - monthPaidAmount(tenant.id, ym.month, ym.year)), 0);

  function recomputeDefault(wrap) {
    const checkedMonths = [...wrap.querySelectorAll("[data-monthcb]:checked")].map(cb => {
      const [m, y] = cb.getAttribute("data-monthcb").split("-").map(Number);
      return { month: m, year: y };
    });
    wrap.querySelector("#rpAmount").value = sumOwed(checkedMonths) || checkedMonths.reduce((s, ym) => s + monthAmount(ym), 0);
  }

  openModal(`${t().collectRent} — ${tenant.name}`, `
    <div class="flex flex-col gap-4">
      <div>
        <div class="text-xs font-medium mb-1.5" style="color:#8a8578">${t().selectMonths}</div>
        <div class="flex flex-col gap-1.5">
          ${allMonths.map((ym, i) => `
            <label class="flex items-center gap-2 text-sm rounded-lg px-3 py-1.5" style="background:#F7F5F0">
              <input type="checkbox" data-monthcb="${ym.month}-${ym.year}" ${i < due.length ? "checked" : ""} />
              <span>${monthYmLabel(ym)}</span>
              ${i >= due.length ? `<span class="badge badge-blue" style="margin-left:auto">${t().advance}</span>` : ""}
            </label>`).join("")}
        </div>
      </div>
      <label class="flex flex-col gap-1 text-sm">
        <span class="font-medium" style="color:#6B6659">${t().amountLabel}</span>
        <input id="rpAmount" type="number" class="inp" value="${sumOwed(due)}" />
      </label>
      <label class="flex flex-col gap-1 text-sm">
        <span class="font-medium" style="color:#6B6659">${t().dateLabel}</span>
        <input id="rpDate" type="date" class="inp" value="${todayISO()}" />
      </label>
      <div class="flex justify-end gap-2">
        <button id="cancelBtn" class="btn btn-outline">${t().cancel}</button>
        <button id="saveBtn" class="btn btn-primary">${t().save}</button>
      </div>
    </div>`, (wrap) => {
    wrap.querySelectorAll("[data-monthcb]").forEach(cb => cb.addEventListener("change", () => recomputeDefault(wrap)));
    wrap.querySelector("#cancelBtn").addEventListener("click", () => wrap.remove());
    wrap.querySelector("#saveBtn").addEventListener("click", async () => {
      const selected = [...wrap.querySelectorAll("[data-monthcb]:checked")].map(cb => {
        const [m, y] = cb.getAttribute("data-monthcb").split("-").map(Number);
        return { month: m, year: y };
      });
      if (!selected.length) return;
      let remaining = Number(wrap.querySelector("#rpAmount").value) || 0;
      const paidDate = wrap.querySelector("#rpDate").value || todayISO();
      let lastId = null;
      for (let i = 0; i < selected.length; i++) {
        const ym = selected[i];
        const isLast = i === selected.length - 1;
        const already = monthPaidAmount(tenant.id, ym.month, ym.year);
        const owedThis = Math.max(0, monthAmount(ym) - already);
        const share = isLast ? remaining : Math.min(remaining, owedThis || monthAmount(ym));
        remaining -= share;
        if (share <= 0 && !isLast) continue;
        const ref = await addDoc(collection(db, "rentPayments"), {
          tenantId: tenant.id, propertyId: prop.id, subUnitId: prop.subUnitId, tenantName: tenant.name,
          month: ym.month, year: ym.year, amount: share,
          paidDate, createdAt: serverTimestamp(),
        });
        lastId = ref.id;
      }
      wrap.remove();
    });
  });
}

// --- Events ---
function autoPrefix(name) { return (name || "EV").replace(/[^A-Za-z]/g, "").slice(0, 2).toUpperCase() || "EV"; }
function memoPrefixFor(subUnitId, eventDateStr) {
  const su = subUnits.find(s => s.id === subUnitId);
  const u = units.find(x => x.id === su?.unitId);
  const prefix = (u?.eventPrefix || autoPrefix(u?.name)).toUpperCase();
  const d = eventDateStr ? new Date(eventDateStr + "T00:00:00") : new Date();
  const yy = String(d.getFullYear()).slice(-2);
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  return `${prefix}-EVT-${yy}/${mm}-`;
}
function memoTaken(subUnitId, memoNo, excludeId) {
  return events.some(e => e.subUnitId === subUnitId && e.id !== excludeId && (e.memoNo || "").toLowerCase() === memoNo.toLowerCase());
}

function normalizeDayNight(time) {
  if (time === "day" || time === "night") return time;
  if (!time) return "night";
  const hour = Number(String(time).split(":")[0]);
  return (!isNaN(hour) && hour >= 6 && hour < 18) ? "day" : "night";
}
function dayNightLabel(time) {
  if (time === "day") return t().dayLabel;
  if (time === "night") return t().nightLabel;
  return time || "";
}

function openBookEventModal(subUnitId, existing) {
  const isEdit = !!existing;
  const su = subUnits.find(s => s.id === subUnitId);
  const unitId = su?.unitId;
  const unitTypes = eventTypes.filter(et => et.unitId === unitId);
  const unitPlaces = eventPlaces.filter(p => p.unitId === unitId);
  let slots = existing
    ? (Array.isArray(existing.eventTypeSlots) && existing.eventTypeSlots.length
        ? existing.eventTypeSlots.map(s => ({ typeId: s.typeId, date: s.date, time: normalizeDayNight(s.time), tableQty: s.tableQty, boyQty: s.boyQty, guestQty: s.guestQty }))
        : (existing.eventTypeIds || []).map((id, idx) => ({
            typeId: id, date: existing.eventDate || todayISO(), time: normalizeDayNight(existing.eventTime),
            tableQty: idx === 0 ? (existing.tableQty ?? "") : "", boyQty: idx === 0 ? (existing.boyQty ?? "") : "", guestQty: "",
          })))
    : [];
  if (!slots.length) slots = [{ typeId: unitTypes[0]?.id || "", date: todayISO(), time: "night", tableQty: "", boyQty: "", guestQty: "" }];
  const earliestDate = () => slots.map(s => s.date).filter(Boolean).sort()[0] || todayISO();
  let currentPrefix = memoPrefixFor(subUnitId, existing?.eventDate || earliestDate());
  const serialPrefill = existing ? (existing.memoNo.startsWith(currentPrefix) ? existing.memoNo.slice(currentPrefix.length) : existing.memoNo) : "";
  openModal(isEdit ? t().editEvent : t().bookEvent, `
    <div class="flex flex-col gap-4">
      <label class="flex flex-col gap-1 text-sm">
        <span class="font-medium" style="color:#6B6659">${t().memoNo}</span>
        <div class="flex items-center gap-2">
          <span id="memoPrefixSpan" class="text-sm font-mono" style="color:#8a8578">${esc(currentPrefix)}</span>
          <input id="evSerial" class="inp" style="max-width:120px" value="${esc(serialPrefill)}" placeholder="${t().serial}" />
        </div>
      </label>
      <div id="memoWarn" class="text-xs" style="color:#9B2C2C"></div>
      <label class="flex flex-col gap-1 text-sm">
        <span class="font-medium" style="color:#6B6659">${t().customerName}</span>
        <input id="evName" class="inp" value="${esc(existing?.customerName || "")}" />
      </label>
      <label class="flex flex-col gap-1 text-sm">
        <span class="font-medium" style="color:#6B6659">${t().address}</span>
        <input id="evAddress" class="inp" value="${esc(existing?.customerAddress || "")}" />
      </label>
      <label class="flex flex-col gap-1 text-sm">
        <span class="font-medium" style="color:#6B6659">${t().phone}</span>
        <input id="evPhone" class="inp" value="${esc(existing?.customerPhone || "")}" />
      </label>
      <div class="grid grid-cols-2 gap-3">
        <label class="flex flex-col gap-1 text-sm">
          <span class="font-medium" style="color:#6B6659">${t().eventPlace}</span>
          <select id="evPlace" class="inp">
            ${unitPlaces.map(p => `<option value="${p.id}" ${existing?.placeId === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("") || `<option value="">—</option>`}
          </select>
        </label>
        <label class="flex flex-col gap-1 text-sm">
          <span class="font-medium" style="color:#6B6659">${t().bookingDate}</span>
          <input id="evBooking" type="date" class="inp" value="${existing?.bookingDate || todayISO()}" />
        </label>
      </div>
      <div class="flex flex-col gap-2 text-sm">
        <span class="font-medium" style="color:#6B6659">${t().eventType} - ${t().eventDate} - ${t().eventTime}</span>
        <div id="etypeSlotsWrap" class="flex flex-col gap-2">${eventTypeSlotRowsHtml(slots, unitTypes)}</div>
        <button type="button" id="addSlotBtn" class="btn btn-outline" style="padding:4px 8px;font-size:12px;align-self:flex-start">${icons.plus}${t().addEventTypeRow}</button>
      </div>
      <label class="flex flex-col gap-1 text-sm"><span class="font-medium" style="color:#6B6659">${t().totalRent}</span><input id="evTotal" type="number" class="inp" value="${existing?.totalRentAmount || ""}" /></label>
      <div class="flex justify-end gap-2">
        <button id="cancelBtn" class="btn btn-outline">${t().cancel}</button>
        <button id="saveBtn" class="btn btn-primary">${t().save}</button>
      </div>
    </div>`, (wrap) => {
    function refreshPrefix() {
      currentPrefix = memoPrefixFor(subUnitId, earliestDate());
      wrap.querySelector("#memoPrefixSpan").textContent = currentPrefix;
    }
    function bindSlotEvents() {
      wrap.querySelectorAll("[data-slot-type]").forEach(el => el.addEventListener("change", () => {
        slots[Number(el.getAttribute("data-slot-type"))].typeId = el.value;
      }));
      wrap.querySelectorAll("[data-slot-date]").forEach(el => el.addEventListener("change", () => {
        slots[Number(el.getAttribute("data-slot-date"))].date = el.value;
        refreshPrefix();
      }));
      wrap.querySelectorAll("[data-slot-time]").forEach(el => el.addEventListener("change", () => {
        slots[Number(el.getAttribute("data-slot-time"))].time = el.value;
      }));
      wrap.querySelectorAll("[data-slot-table]").forEach(el => el.addEventListener("input", () => {
        slots[Number(el.getAttribute("data-slot-table"))].tableQty = el.value;
      }));
      wrap.querySelectorAll("[data-slot-boy]").forEach(el => el.addEventListener("input", () => {

      }));

    function renderSlots() {
      wrap.querySelector("#etypeSlotsWrap").innerHTML = eventTypeSlotRowsHtml(slots, unitTypes);

    wrap.querySelector("#addSlotBtn").addEventListener("click", () => {

      else { warn.textContent = ""; clearInvalid(wrap.querySelector("#evSerial")); }
    };
    wrap.querySelector("#evSerial").addEventListener("input", checkDup);
    wrap.querySelector("#saveBtn").addEventListener("click", async () => {
      const fields = {
        evSerial: wrap.querySelector("#evSerial"), evName: wrap.querySelector("#evName"),
        evAddress: wrap.querySelector("#evAddress"), evPlace: wrap.querySelector("#evPlace"),
        evBooking: wrap.querySelector("#evBooking"),
        evTotal: wrap.querySelector("#evTotal"),
      };
      let ok = true;
      Object.values(fields).forEach(f => {
        if (!f.value || !f.value.toString().trim()) { markInvalid(f); ok = false; } else clearInvalid(f);
      });
      const validSlots = slots.filter(s => s.typeId && s.date && s.time);
      if (!validSlots.length || validSlots.length !== slots.length) ok = false;
      const fullMemo = currentPrefix + fields.evSerial.value.trim();
      if (memoTaken(subUnitId, fullMemo, existing?.id)) { markInvalid(fields.evSerial); ok = false; }
      if (!ok) { wrap.querySelector("#memoWarn").textContent = t().fillAllFields; return; }

      const cleanSlots = slots.map(s => ({
        typeId: s.typeId, date: s.date, time: s.time,
        tableQty: Number(s.tableQty) || 0, boyQty: Number(s.boyQty) || 0, guestQty: Number(s.guestQty) || 0,
      }));
      const sortedSlots = [...cleanSlots].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
      const data = {
        memoNo: fullMemo, customerName: fields.evName.value.trim(), customerAddress: fields.evAddress.value.trim(),
        customerPhone: wrap.querySelector("#evPhone").value.trim(),
        placeId: fields.evPlace.value, eventTypeIds: cleanSlots.map(s => s.typeId), eventTypeSlots: cleanSlots,
        bookingDate: fields.evBooking.value, eventDate: sortedSlots[0].date, eventTime: sortedSlots[0].time,
        totalRentAmount: Number(fields.evTotal.value) || 0,
      };
      if (isEdit) {
        const changed = diffChanged(existing, data);
        if (Object.keys(changed).length) await performEdit("events", existing.id, changed, subUnitId);
      } else {
        await addDoc(collection(db, "events"), { subUnitId, status: "pending", createdAt: serverTimestamp(), ...data });
      }
      wrap.remove();
    });
  });
}

function paintUnitExpensePanel(body, unitId) {
  const u = units.find(x => x.id === unitId);
  const cats = unitExpenseCategories.filter(c => c.unitId === unitId);
  const entries = unitExpenses.filter(x => x.unitId === unitId).sort((a, b) => (a.date < b.date ? 1 : -1));
  const add = isAdmin() || canAdd(unitId);
  const edit = isAdmin() || canEdit(unitId);
  body.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-sm font-semibold" style="color:#1B4332">${esc(u?.name || "")} — ${t().unitExpenseEntries}</h3>
      ${add ? `<button id="addUnitExpEntryBtn" class="btn btn-primary" style="padding:6px 12px;font-size:12px">${icons.plus}${t().addUnitExpenseEntry}</button>` : ""}
    </div>
    <div class="flex flex-wrap gap-2 mb-4">
      ${cats.map(c => {
        const due = unitExpenseCurrentDue(c), adv = unitExpenseCurrentAdvance(c);
        return `<span class="badge ${due > 0 ? "badge-gold" : adv > 0 ? "badge-blue" : "badge-brown"}">${esc(c.name)}${due > 0 ? ` · ${t().due} ৳${due.toLocaleString()}` : adv > 0 ? ` · ${t().advance} ৳${adv.toLocaleString()}` : ""}</span>`;
      }).join("") || `<span class="text-xs" style="color:#8a8578">${t().noData}</span>`}
    </div>
    <div class="flex flex-col gap-2">
      ${entries.map(x => `
        <div class="card p-3 flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="text-sm font-medium truncate2">${esc(cats.find(c => c.id === x.categoryId)?.name || "—")} ${pendingApprovalFor(x.id) ? `<span class="badge badge-gold ml-1">${t().approvalPendingBadge}</span>` : ""}</div>
            <div class="text-xs truncate2" style="color:#8a8578">${x.details ? esc(x.details) + " · " : ""}${esc(x.date)}</div>
          </div>
          <div class="flex items-center gap-2" style="flex-shrink:0">
            <span class="txt-expense font-medium">৳${Number(x.amount).toLocaleString()}</span>
            ${edit ? `<button data-editentry="${x.id}" style="color:#8a8578">${icons.pencil}</button>` : ""}
            ${isAdmin() ? `<button data-delentry="${x.id}" style="color:#9B2C2C">${icons.trash}</button>` : ""}
          </div>
        </div>`).join("") || `<p class="text-xs" style="color:#8a8578">${t().noData}</p>`}
    </div>`;
  const addBtn = document.getElementById("addUnitExpEntryBtn");
  if (addBtn) addBtn.addEventListener("click", () => openUnitExpEntryModal(unitId));
  body.querySelectorAll("[data-editentry]").forEach(b => b.addEventListener("click", () => {
    const x = unitExpenses.find(y => y.id === b.getAttribute("data-editentry"));
    openUnitExpEntryModal(x.unitId, x);
  }));
  body.querySelectorAll("[data-delentry]").forEach(b => b.addEventListener("click", () => {
    withPasswordConfirm(async () => { await deleteDoc(doc(db, "unitExpenses", b.getAttribute("data-delentry"))); });
  }));
}
function openUnitExpEntryModal(unitId, existing) {
  const cats = unitExpenseCategories.filter(c => c.unitId === unitId);
  openModal(existing ? t().edit : t().addUnitExpenseEntry, `
    <div class="flex flex-col gap-4">
      <label class="flex flex-col gap-1 text-sm">
        <span class="font-medium" style="color:#6B6659">${t().expenseCategory}</span>
        <select id="ueCat" class="inp">${cats.map(c => `<option value="${c.id}" ${existing?.categoryId === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("") || `<option value="">—</option>`}</select>
      </label>
      <label class="flex flex-col gap-1 text-sm"><span class="font-medium" style="color:#6B6659">${t().amountLabel}</span><input id="ueAmount" type="number" class="inp" value="${existing?.amount || ""}" /></label>
      <label class="flex flex-col gap-1 text-sm"><span class="font-medium" style="color:#6B6659">${t().dateLabel}</span><input id="ueDate" type="date" class="inp" value="${existing?.date || todayISO()}" /></label>
      <label class="flex flex-col gap-1 text-sm"><span class="font-medium" style="color:#6B6659">${t().details}</span><input id="ueDetails" class="inp" value="${esc(existing?.details || "")}" /></label>
      <div class="flex justify-end gap-2"><button id="cancelBtn" class="btn btn-outline">${t().cancel}</button><button id="saveBtn" class="btn btn-primary">${t().save}</button></div>
    </div>`, (wrap) => {
    wrap.querySelector("#cancelBtn").addEventListener("click", () => wrap.remove());
    wrap.querySelector("#saveBtn").addEventListener("click", () => {
      const amount = Number(wrap.querySelector("#ueAmount").value) || 0;
      if (!amount) return;
      const dateVal = wrap.querySelector("#ueDate").value || todayISO();
      const [dy, dm] = dateVal.split("-").map(Number);
      const data = { categoryId: wrap.querySelector("#ueCat").value, amount, date: dateVal, month: dm, year: dy, details: wrap.querySelector("#ueDetails").value.trim() };
      wrap.remove();
      if (existing) {
        performEdit("unitExpenses", existing.id, data, unitId);
      } else {
        addDoc(collection(db, "unitExpenses"), { unitId, ...data, createdAt: serverTimestamp() });
      }
    });
  });
}

function targetLabel(req) {
  const c = req.targetCollection;
  if (c === "tenants") { const tn = tenants.find(x => x.id === req.targetId); return tn ? tn.name : "—"; }
  if (c === "events") { const ev = events.find(x => x.id === req.targetId); return ev ? `${ev.customerName} (${ev.memoNo})` : "—"; }
  if (c === "rentPayments") { const p = rentPayments.find(x => x.id === req.targetId); return p ? `${p.tenantName || ""} — ${t().collectRent}` : t().collectRent; }
  if (c === "expenses") { const x = expenses.find(y => y.id === req.targetId); return x ? `${x.tenantName || ""} — ${t().addExpense}` : t().addExpense; }
  if (c === "eventPayments") { const p = eventPayments.find(x => x.id === req.targetId); const ev = p ? events.find(e => e.id === p.eventId) : null; return ev ? `${ev.customerName} (${ev.memoNo}) — ${t().payHistory}` : t().payHistory; }
  if (c === "eventExpenses") { const x = eventExpenses.find(y => y.id === req.targetId); const ev = x ? events.find(e => e.id === x.eventId) : null; return ev ? `${ev.customerName} (${ev.memoNo}) — ${t().eventExpenseHistory}` : t().eventExpenseHistory; }
  if (c === "unitExpenses") { const x = unitExpenses.find(y => y.id === req.targetId); const u = x ? units.find(un => un.id === x.unitId) : null; const cat = x ? unitExpenseCategories.find(cc => cc.id === x.categoryId) : null; return u ? `${u.name} — ${cat?.name || t().unitExpenseEntries}` : t().unitExpenseEntries; }
  return "—";
}
const FIELD_LABELS = {
  name: "name", address: "address", phone: "phone", customerPhone: "phone", rentAmount: "rentAmount",
  customerName: "customerName", customerAddress: "address", totalRentAmount: "totalRent",
  tableQty: "tableQty", boyQty: "boyQty", eventDate: "eventDate", eventTime: "eventTime",
  bookingDate: "bookingDate", memoNo: "memoNo", amount: "amountLabel", paidDate: "bookingDate",
  date: "bookingDate", details: "details", eventTypeIds: "eventType", eventTypeSlots: "eventType", placeId: "eventPlace", note: "details",
};
function formatFieldValue(key, val) {
  if (val == null || val === "") return "—";
  if (key === "eventTypeIds") return (Array.isArray(val) ? val : []).map(id => eventTypes.find(e => e.id === id)?.name || id).join(", ") || "—";
  if (key === "eventTypeSlots") return (Array.isArray(val) ? val : []).map(s => `${eventTypes.find(e => e.id === s.typeId)?.name || s.typeId} (${s.date || ""} ${s.time || ""})`).join(", ") || "—";
  if (key === "placeId") return placeName(val);
  if (key === "amount" || key === "rentAmount" || key === "totalRentAmount") return `৳${Number(val).toLocaleString()}`;
  return esc(String(val));
}
function diffRowsHtml(req) {
  const before = req.before || {};
  const after = req.changes || {};
  return Object.keys(after).filter(k => {
    const a = before[k], b = after[k];
    return Array.isArray(b) ? JSON.stringify(a || []) !== JSON.stringify(b) : a !== b;
  }).map(k => {
    const label = t()[FIELD_LABELS[k]] || k;
    return `<div class="flex flex-wrap items-center justify-between gap-x-2 text-xs rounded-lg px-3 py-1.5" style="background:#F7F5F0">
      <span style="color:#6B6659" class="truncate2">${esc(label)}</span>
      <span class="truncate2">${formatFieldValue(k, before[k])} → <span style="font-weight:600;color:#1B4332">${formatFieldValue(k, after[k])}</span></span>
    </div>`;
  }).join("") || `<p class="text-xs" style="color:#8a8578">—</p>`;
}
function diffChanged(oldObj, newObj) {
  const out = {};
  Object.keys(newObj).forEach(k => {
    const a = oldObj ? oldObj[k] : undefined;
    const b = newObj[k];
    const changed = Array.isArray(b) ? JSON.stringify(a || []) !== JSON.stringify(b) : a !== b;
    if (changed) out[k] = b;
  });
  return out;
}

function readPermMatrix(wrap) {
  const out = {};
  wrap.querySelectorAll("[data-permsub]").forEach(cb => {
    const subId = cb.getAttribute("data-permsub");
    const flag = cb.getAttribute("data-permflag");
    if (!out[subId]) out[subId] = { view: false, add: false, edit: false, reportView: false, reportDownload: false };
    out[subId][flag] = cb.checked;
  });
  Object.keys(out).forEach(k => { if (!out[k].view && !out[k].add && !out[k].edit && !out[k].reportView && !out[k].reportDownload) delete out[k]; });
  return out;
}

          await signOut(secAuth);
          await setDoc(doc(db, "userSecrets", user.id), { password: newPass, updatedAt: serverTimestamp() });
          pwMsg.style.color = "#1B4332"; pwMsg.textContent = t().passwordUpdated;
          changeBody.style.display = "none";
        } catch (err) {
          pwMsg.style.color = "#9B2C2C"; pwMsg.textContent = t().passwordError;
        } finally {
          await deleteApp(secApp);
        }
      });
    });
    wrap.querySelector("#saveBtn").addEventListener("click", async () => {
      const name = wrap.querySelector("#uName").value.trim();
      const email = wrap.querySelector("#uEmail").value.trim();
      const isAdminUser = wrap.querySelector("#uIsAdmin").checked;
      const permissions = isAdminUser ? {} : readPermMatrix(wrap);
      if (!name) return;
      await updateDoc(doc(db, "users", user.id), {
        name, email, role: isAdminUser ? "admin" : "user", permissions,
      });
      wrap.remove();
    });
  });
}

// ---------------------------------------------------------------------------
// Firestore listeners
// ---------------------------------------------------------------------------
function repaintCurrentTab() {
  if (tab === "dashboard") paintDashboardCard();
  if (tab === "dataEntry") paintDataEntryBody();
  if (tab === "adminPanel" && isAdmin()) {
    paintAdminGrid(); paintPropertyGrid(); paintUnitExpCatGrid(); paintCategoryGrid(); paintEventTypeGrid(); paintEventPlaceGrid(); paintUsersList();
  }
  if (tab === "approvalPending") paintApprovalList();
  if (tab === "reports") paintReportBody();
  document.querySelectorAll("[data-prop-modal]").forEach(w => { const id = w.dataset.propModal; if (id) paintPropertyDetailBody(id); });
  document.querySelectorAll("[data-event-modal]").forEach(w => { const id = w.dataset.eventModal; if (id) paintEventDetailBody(id); });
  const headerBadge = document.querySelector('[data-tab="approvalPending"] .badge');
  if (headerBadge) {
    const n = approvalRequests.filter(r => r.status === "pending").length;
    headerBadge.textContent = n;
    headerBadge.className = `badge ${n ? "badge-red" : "badge-gray"}`;
    headerBadge.style.marginLeft = "2px";
  }
}

function startAllListeners() {
  if (unsubs.length) return;
  const bind = (name, target, refreshShell) => onSnapshot(collection(db, name), (snap) => {
    target.length = 0;
    snap.docs.forEach(d => target.push({ id: d.id, ...d.data() }));
    if (refreshShell && document.querySelector(".tab-btn")) renderApp(); else repaintCurrentTab();
  });
  unsubs.push(bind("units", units, true));
  unsubs.push(bind("subUnits", subUnits, true));
  unsubs.push(bind("users", allUsers));
  unsubs.push(bind("expenseCategories", expenseCategories));
  unsubs.push(bind("eventTypes", eventTypes));
  unsubs.push(bind("eventPlaces", eventPlaces));
  unsubs.push(bind("propertyIds", propertyIds));
  unsubs.push(bind("unitExpenseCategories", unitExpenseCategories));
  unsubs.push(bind("unitExpenses", unitExpenses));
  unsubs.push(bind("tenants", tenants));
  unsubs.push(bind("rentPayments", rentPayments));
  unsubs.push(bind("rentSetups", rentSetups));
  unsubs.push(bind("expenses", expenses));
  unsubs.push(bind("events", events));
  unsubs.push(bind("eventPayments", eventPayments));
  unsubs.push(bind("eventExpenses", eventExpenses));
  unsubs.push(bind("eventOtherServices", eventOtherServices));
  unsubs.push(bind("approvalRequests", approvalRequests));
  unsubs.push(onSnapshot(doc(db, "settings", "global"), (snap) => {
    globalSettings = { hijriOffsetDays: 0, ...(snap.exists() ? snap.data() : {}) };
    const bar = document.getElementById("dateBar");
    if (bar) bar.innerHTML = dateBarHtml();
    repaintCurrentTab();
  }));
  seedIfEmpty();
}
function stopAllListeners() {
  unsubs.forEach(u => u());
  unsubs = [];
  units.length = 0; subUnits.length = 0; allUsers.length = 0;
  expenseCategories.length = 0; eventTypes.length = 0; eventPlaces.length = 0; propertyIds.length = 0;
  unitExpenseCategories.length = 0; unitExpenses.length = 0;
  tenants.length = 0; rentPayments.length = 0; expenses.length = 0;
  events.length = 0; eventPayments.length = 0; eventExpenses.length = 0; eventOtherServices.length = 0;
  approvalRequests.length = 0;
  globalSettings = { hijriOffsetDays: 0 };
}
async function seedIfEmpty() {
  if (!isAdmin()) return;
  const snap = await getDocs(collection(db, "units"));
  if (!snap.empty) return;
  const unitRef = await addDoc(collection(db, "units"), { name: "Green Park", eventPrefix: "GP", createdAt: serverTimestamp() });
  for (const s of [{ name: "Event", billingType: "perEvent" }, { name: "Shop", billingType: "monthly" }, { name: "House", billingType: "monthly" }]) {
    await addDoc(collection(db, "subUnits"), { unitId: unitRef.id, name: s.name, billingType: s.billingType, createdAt: serverTimestamp() });
  }
}

onAuthStateChanged(auth, async (u) => {
  authChecked = true;
  currentUser = u || null;
  if (!u) { profile = null; profileChecked = true; stopAllListeners(); render(); return; }
  profileChecked = false; render();
  const snap = await getDoc(doc(db, "users", u.uid));
  profile = snap.exists() ? snap.data() : null;
  profileChecked = true;
  render();
  if (profile) startAllListeners();
});

setInterval(() => {
  const bar = document.getElementById("dateBar");
  if (bar) bar.innerHTML = dateBarHtml();
}, 1000);
</script>
